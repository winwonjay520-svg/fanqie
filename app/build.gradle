plugins { id 'com.android.application' }
android {
    namespace 'com.lumifocus.app'
    compileSdk 37
    defaultConfig {
        applicationId 'com.lumifocus.app'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '2.9.4'
        testInstrumentationRunner 'com.lumifocus.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
}
